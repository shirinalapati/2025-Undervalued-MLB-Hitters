services:
  - type: web
    name: undervalued-mlb-players
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: python frontend/table_dashboard.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: LIVE_REFRESH_ENABLED
        value: "0"
      - key: LIVE_GIT_SYNC
        value: "1"
      - key: LIVE_GIT_SYNC_MINUTES
        value: "3"
      - key: LIVE_DATA_POLL_MINUTES
        value: "2"
